[project]
name = "agent-autosuggest"
version = "0.2.0"
description = "Auto-Suggest: recommends the Opportunities a profile's data supports"
license = "MIT"
readme = "README.md"
authors = [
    { name = "OramaSearch, Inc." }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "openai>=2.53.0",
]

[project.scripts]
agent-autosuggest = "agent_autosuggest:main"
agent-autosuggest-serve = "agent_autosuggest:serve"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
